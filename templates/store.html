{% extends "base.html" %}
{% block content %}
<div class="page-header">
    <h1>🛒 Recycled Store</h1>
    <p>Redeem points for products made from YOUR plastic</p>
</div>

<div class="products-grid">
    {% for product in products %}
    <div class="product-card">
        <img src="{{ url_for('static', filename='assets/' + product.image) }}" 
     alt="{{ product.name }}" 
     style="width: 100%; height: 200px; object-fit: cover;">
<h3>{{ product.name }}</h3>
        <div class="product-points">💎 {{ product.points }} points</div>
        <button class="redeem-btn" data-product-id="{{ product.id }}" data-product-points="{{ product.points }}">
            Redeem
        </button>
    </div>
    {% endfor %}
</div>

<script>
// This runs immediately on store page
document.addEventListener('DOMContentLoaded', function() {
    const redeemButtons = document.querySelectorAll('.redeem-btn');
    redeemButtons.forEach(button => {
        button.addEventListener('click', function() {
            const productId = this.getAttribute('data-product-id');
            const points = parseInt(this.getAttribute('data-product-points'));
            redeemProduct(productId, points);
        });
    });
});
</script>
{% endblock %}
